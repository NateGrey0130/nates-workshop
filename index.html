<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nate's Workshop</title>
<style>
/* This page is the ONE of the ten that does not load /shared/styles.css - it is
   deliberately a single self-contained file with its own tokens - so it needs
   its own copy of the @font-face rules. Everything else inherits them from
   shared. Every face is variable: one file covers the whole weight axis.
   Keep in step with the block at the top of /shared/styles.css.

   The display face is 'Saira' at font-stretch: 75%, NOT 'Saira Condensed' -
   that family is static-only and Google answers a weight range for it with a
   404. Setting the family without the stretch gets the 100% width instead,
   which looks like the wrong font rather than like a mistake.

   This page keeps its OWN palette - its token names are its own - but the
   values are Rust & Ash, same as everything behind it. See the block below. */
@font-face {
  font-family: 'Saira';
  src: url('/shared/fonts/saira-variable.woff2') format('woff2');
  font-weight: 100 900;
  font-stretch: 75% 100%;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'IBM Plex Sans';
  src: url('/shared/fonts/ibm-plex-sans-variable.woff2') format('woff2');
  font-weight: 100 700;
  font-style: normal;
  font-display: swap;
}

/* Rust & Ash, the same values shared/styles.css carries under different
   names. The names stay this page's own because the page is deliberately
   self-contained - see the note above the fonts - but a visitor should not
   be able to tell that the front door is a different file from the rooms.

   --text-muted is #8A8076 rather than the #6B6259 the palette was drafted
   with: 3.1:1 against this background, which is the same failure the old
   #5a6178 had. 4.86 measured. */
:root {
  --bg: #14110F;
  --bg-card: #1B1714;
  --border: #302A24;
  --text: #E9E3DA;
  --text-sub: #9C9287;
  --text-muted: #8A8076;
  --accent: #C4622D;
  --accent2: #D9A05B;
  --success: #7E9A5E;
  --warning: #C99A3E;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 24px;
}
.hero {
  text-align: center;
  margin-bottom: 56px;
}
.hero h1 {
  font-family: 'Saira', system-ui, sans-serif;
  font-stretch: 75%;
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1px;
  /* Solid, not a gradient clipped to the text - the same change .logo took
     in phase 1, for the same reason: a gradient on a wordmark reads as a
     an effect rather than as a colour, and this scheme does not do effects. */
  color: var(--accent);
  margin-bottom: 8px;
}
.hero p {
  color: var(--text-sub);
  font-size: 16px;
  font-weight: 400;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
  max-width: 960px;
  width: 100%;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 32px 28px;
  text-decoration: none;
  color: var(--text);
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(196,98,45,0.05), rgba(217,160,91,0.05));
  opacity: 0;
  transition: opacity 0.25s ease;
}
/* The lift stays and the glow goes: --shadow is `none` in this scheme, and a
   32px blur under one card is the thing that token turned off everywhere
   else. */
.card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
}
.card:hover::before { opacity: 1; }
.card-icon {
  font-size: 36px;
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(196,98,45,0.10);
  border-radius: 4px;
}
.card h2 {
  font-family: 'Saira', system-ui, sans-serif;
  font-stretch: 75%;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
  position: relative;
}
.card p {
  font-size: 14px;
  color: var(--text-sub);
  line-height: 1.6;
  position: relative;
}
/* align-self, because inline-block does not survive a flex column: .card is
   flex with the default align-items: stretch, so the tag was a 250px bar with
   the word `live` at one end of it. Pre-existing and easy to miss in numbers -
   the computed display really is inline-block - but obvious in a screenshot. */
.card-tag {
  display: inline-block;
  align-self: flex-start;
  font-family: 'Saira', system-ui, sans-serif;
  font-stretch: 75%;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 3px;
  background: rgba(126,154,94,0.12);
  color: var(--success);
  position: relative;
}
.card-soon .card-tag {
  background: rgba(201,154,62,0.12);
  color: var(--warning);
}
/* NO OPACITY, and the numbers are the reason - the same finding the wizard's
   .st.na rule carries. At opacity 0.5, composited down to opaque against this
   background, this card's description measured 2.48:1 and its `soon` tag
   2.76:1, against 5.83 and 6.93 undimmed. It is a card describing something
   that is coming, which is information someone is meant to read.

   Unavailable is already said three other ways: the tag reads `soon`, there is
   no link to follow, and pointer-events is off. The dashed border says it once
   more, the way the wizard marks a step that does not apply. */
.card-soon {
  border-style: dashed;
  pointer-events: none;
}
.card-soon h2, .card-soon .card-icon { color: var(--text-sub); }
footer {
  margin-top: 80px;
  color: var(--text-muted);
  font-size: 13px;
  font-family: 'Saira', system-ui, sans-serif;
  font-stretch: 75%;
  letter-spacing: 0.04em;
}
</style>
</head>
<body>

<div class="hero">
  <h1>Nate's Workshop</h1>
  <p>Tools, toys, and experiments — built with Claude.</p>
</div>

<div class="grid" id="appGrid"></div>

<footer>powered by vibes & claude</footer>

<script>
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

fetch('/apps/manifest.json')
  .then(res => res.json())
  .then(({ apps }) => {
    document.getElementById('appGrid').innerHTML = apps.map(app => {
      const inner = `
        <div class="card-icon">${app.icon}</div>
        <h2>${esc(app.name)}</h2>
        <p>${esc(app.description)}</p>
        <span class="card-tag">${esc(app.status)}</span>`;
      return app.status === 'live' && app.slug
        ? `<a class="card" href="/apps/${encodeURIComponent(app.slug)}/">${inner}</a>`
        : `<div class="card card-soon">${inner}</div>`;
    }).join('');
  })
  .catch(err => {
    document.getElementById('appGrid').innerHTML =
      `<p style="color:var(--text-muted)">Could not load app list: ${esc(err.message)}</p>`;
  });
</script>

</body>
</html>
