# The end-to-end regression suite, on EVERY pull request.
# SKILL-AUDIT.md F32 added it; F36 removed the path filter it was added with.
#
# REQUIRED SINCE 2026-09-16, the same posture as tests.yml: the `regression`
# check-run is named by `main`'s ruleset `22209348`, so a red run here stops the
# merge. From 2026-09-04 to 2026-09-16 it was reporting only. RENAMING THE JOB
# BREAKS THE GATE - the ruleset names the job id.
#
# WHY IT IS SEPARATE FROM tests.yml. It was split off to be filtered, and the
# filter is gone - but keep the split. The two run CONCURRENTLY, with distinct
# concurrency groups, so a pull request waits for the slower of them rather than
# for both: measured on PR #686, both were created at 2026-09-04T13:12:22Z and
# finished at 13:12:51 and 13:13:18. Folded into tests.yml as another step, this
# suite would extend that job instead of running beside it.
#
# IT WAS FILTERED BY PATH UNTIL 2026-09-04 AND IS NOT ANY MORE. F36. The filter
# was justified with 170 seconds, timed on the Windows development machine; the
# same suite takes 56 seconds here, so the whole cost of running it always is
# about 26 seconds of wall clock on the pull requests that used to skip it.
#
# The reason to delete it rather than tune it is the failure mode. A path list
# is correct the day it is written and wrong the moment something
# regression.mjs reads moves outside it - and then the suite does not run, so
# GREEN MEANS "NOT ASKED" RATHER THAN "PASSED". This repo has been burned by
# exactly that shape twice: a `grep -c` that reported 272/272 clean on a pure-LF
# file, and 65 consecutive Pages failures nobody read. A check that can stop
# covering something without saying so is worth less than the seconds it saves.
#
# WHAT THIS DOES NOT COVER. smoke.mjs proves the machinery; this proves a
# REQUEST works against a database built from nothing, which is the only thing
# that catches a fresh environment being broken. A local run cannot substitute:
# a development machine has a warm .wrangler directory and a runner does not,
# which is the whole reason a bare-clone check belongs in CI.

name: regression

on:
  pull_request:

# A pull request pushed to twice does not need the first run finished.
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This workflow inspects the tree and nothing else.
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    # 170s on the development machine; a cold runner is slower and boots
    # wrangler as well. Generous rather than tight - a timeout here would read
    # as a broken suite.
    timeout-minutes: 20
    env:
      # There is no package.json here by design, so `npx wrangler` resolves from
      # the npx cache and PROMPTS to install when it cannot. A runner has no
      # terminal to answer, so the prompt becomes a hang or a failure.
      NPM_CONFIG_YES: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and the base it merges into, for --affected below.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          # Matches the version this repo is developed on. No cache key: there
          # is no lockfile to key on.
          node-version: '24'

      # PALLADIUM ONLY (groups.json). This suite drives the character creator's
      # routes and nothing else, so a change that touches neither a Palladium
      # file nor a shared one skips it. The job still runs and reports success,
      # so the check-run the ruleset names still appears on every pull request.
      - name: which groups changed
        id: groups
        run: node scripts/groups.mjs --affected HEAD^1 HEAD >> "$GITHUB_OUTPUT"

      # Says so in words, so a green check on a skipped run cannot be read as
      # the suite having passed.
      - name: skipped - no Palladium or shared file changed
        if: steps.groups.outputs.palladium != 'true'
        run: echo "regression did not run - this change touches no Palladium or shared file (groups.json)"

      # WARM THE npx CACHE BEFORE ANYTHING IS TIMED. Same reason as tests.yml
      # SHIP-PR-AUDIT.md F13: this suite spawns wrangler, and a cold download
      # inside a timed region is what turned that job red on PRs #668 and #669.
      - name: warm the npx cache
        if: steps.groups.outputs.palladium == 'true'
        run: npx wrangler --version

      - name: regression
        if: steps.groups.outputs.palladium == 'true'
        run: node apps/character-creator/test/regression.mjs
