<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Dashboard — Nate's Workshop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f1117; color: #e6e8ee; min-height: 100vh; padding: 1.5rem;
}
a { color: #7aa2f7; text-decoration: none; }
.wrap { max-width: 900px; margin: 0 auto; }
.panel { background: #171b26; border: 1px solid #2a3040; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
.panel h2 { font-size: 1.3rem; margin-bottom: 0.25rem; }
.panel h3 { font-size: 0.95rem; margin: 0.9rem 0 0.4rem; color: #cfd6e4; }
.muted { color: #8b93a7; font-size: 0.85rem; }
.small { font-size: 0.8rem; }
.err { color: #e08585; }
.tag {
  display: inline-block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 0.12rem 0.5rem; border-radius: 999px; background: #223; border: 1px solid #345; margin-right: 0.3rem;
}
.tag.gm { background: #2a4030; border-color: #446a50; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 0.45rem 0.6rem; text-align: left; border-bottom: 1px solid #222836; font-size: 0.9rem; }
th { color: #8b93a7; font-weight: 500; font-size: 0.78rem; }
button {
  font: inherit; background: #23304a; color: #cfe0ff; border: 1px solid #4a6aa5;
  border-radius: 8px; padding: 0.4rem 0.9rem; cursor: pointer;
}
button:hover { background: #2b3c5e; }
textarea {
  font: inherit; background: #10141d; color: #e6e8ee; border: 1px solid #2a3040;
  border-radius: 8px; padding: 0.45rem 0.6rem; width: 100%; min-height: 5.5rem;
}
.rowline { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin: 0.4rem 0; }
.entry { border-left: 3px solid #2a3040; padding: 0.4rem 0.8rem; margin: 0.6rem 0; }
.entry.campaign { border-left-color: #446a50; }
.entry .body { font-size: 0.9rem; line-height: 1.45; white-space: pre-wrap; margin-top: 0.25rem; }
.pools-cell { font-size: 0.8rem; color: #b8bfce; white-space: nowrap; }
</style>
</head>
<body>

<div class="wrap">
  <div class="rowline" style="justify-content:space-between">
    <a href="/apps/character-creator/">&larr; Character Creator</a>
    <a href="/">Workshop</a>
  </div>
  <div id="app"><p class="muted">Loading dashboard…</p></div>
</div>

<script>
'use strict';
const campaignId = new URLSearchParams(location.search).get('campaign_id');
const POOLS = [['hp', 'H.P.'], ['sdc', 'S.D.C.'], ['mdc', 'M.D.C.'], ['ppe', 'P.P.E.'], ['isp', 'I.S.P.']];
const D = { campaign: null, isGm: false, roster: [], journal: [], classNames: {} };
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, opts) {
  const res = await fetch('/api/character-creator/' + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('API ' + res.status));
  return data;
}

async function load() {
  try {
    const [campRes, rosterRes, journalRes, classesRes] = await Promise.all([
      api('campaigns/' + campaignId),
      api('characters?campaign_id=' + campaignId),
      api('journal?campaign_id=' + campaignId),
      api('classes'),
    ]);
    D.campaign = campRes.campaign; D.isGm = campRes.is_gm;
    D.roster = rosterRes.characters;
    D.journal = journalRes.entries;
    D.classNames = Object.fromEntries(classesRes.classes.map((c) => [c.id, c.name]));
    render();
  } catch (err) {
    $('app').innerHTML = `<div class="panel"><p class="err">Failed to load: ${esc(err.message)}</p></div>`;
  }
}

function poolsCell(c) {
  const parts = POOLS
    .filter(([k]) => c[k + '_max'] != null || c[k + '_current'] != null)
    .map(([k, label]) => `${label} ${c[k + '_current'] ?? '—'}/${c[k + '_max'] ?? '—'}`);
  return parts.join(' · ') || '—';
}

function render() {
  const camp = D.campaign;
  const charName = Object.fromEntries(D.roster.map((c) => [c.id, c.name]));

  const rosterRows = D.roster.map((c) => `
    <tr>
      <td><a href="sheet.html?id=${c.id}">${esc(c.name)}</a></td>
      <td>${esc(D.classNames[c.class_id] || c.class_id)}</td>
      <td>${c.level} <span class="muted small">(${c.xp} XP)</span></td>
      <td class="muted small">${esc(c.player_email)}</td>
      <td class="pools-cell">${poolsCell(c)}</td>
    </tr>`).join('');

  const journalHtml = D.journal.slice(0, 20).map((e) => {
    const isCampaign = e.character_id == null;
    const who = isCampaign ? 'campaign' : (charName[e.character_id] || 'character #' + e.character_id);
    return `<div class="entry ${isCampaign ? 'campaign' : ''}">
      <span class="tag ${isCampaign ? 'gm' : ''}">${esc(who)}</span>
      <b>${esc(e.title || 'Untitled')}</b>
      <span class="muted small"> — ${esc(e.author_email)}${e.session_date ? ' · session ' + esc(e.session_date) : ''} · ${esc(e.created_at)}</span>
      <div class="body">${esc(e.body)}</div>
    </div>`;
  }).join('') || '<p class="muted small">No journal entries yet.</p>';

  $('app').innerHTML = `
  <div class="panel">
    <h2>${esc(camp.name)} ${D.isGm ? '<span class="tag gm">you are the GM</span>' : ''}</h2>
    <p class="muted">${esc(camp.system)} · GM: ${esc(camp.gm_email)}${camp.description ? ' — ' + esc(camp.description) : ''}</p>
    <h3>Party roster</h3>
    ${rosterRows
      ? `<table><tr><th>Character</th><th>Class</th><th>Level</th><th>Player</th><th>Pools (cur/max)</th></tr>${rosterRows}</table>`
      : '<p class="muted small">No characters in this campaign yet.</p>'}
  </div>

  ${D.isGm ? `
  <div class="panel">
    <h3 style="margin-top:0">GM notes <span class="muted small">(only you can see or edit these)</span></h3>
    <textarea id="gm-notes">${esc(camp.gm_notes || '')}</textarea>
    <div class="rowline"><button onclick="saveNotes()">💾 Save GM notes</button><span id="notes-msg" class="muted small"></span></div>
  </div>` : ''}

  <div class="panel">
    <h3 style="margin-top:0">Campaign journal <span class="muted small">(newest first)</span></h3>
    ${journalHtml}
  </div>`;
}

window.saveNotes = async () => {
  try {
    await api('campaigns/' + campaignId, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gm_notes: $('gm-notes').value }),
    });
    $('notes-msg').textContent = 'Saved.';
  } catch (err) {
    $('notes-msg').textContent = 'Save failed: ' + err.message;
    $('notes-msg').className = 'err small';
  }
};

if (!campaignId) {
  $('app').innerHTML = '<div class="panel"><p class="err">No campaign_id — open a dashboard from the Character Creator landing page.</p></div>';
} else {
  load();
}
</script>

</body>
</html>
