# Local-dev/migrations config only. Kept out of the repo root on purpose:
# production config (D1 binding, secrets) lives in the Cloudflare Pages dashboard,
# matching how the rest of Nate's Workshop is configured. See README.md.
name = "character-creator"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "character-creator-db"
# Placeholder is fine for --local; replace with the real ID from the dashboard
# (Workers & Pages -> D1 -> character-creator-db) to run remote migrations.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
