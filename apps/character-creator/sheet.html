<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character Sheet moved — Nate's Workshop</title>
<link rel="canonical" href="/apps/character-sheet/">
<meta name="robots" content="noindex">
<!-- Character Sheet moved to /apps/character-sheet/ when the character creator was split into five apps.
     This stub stays indefinitely: it is what a bookmark, a link in someone's
     notes, or a sheet URL sent to a player still resolves to.

     A script rather than <meta http-equiv="refresh"> because the QUERY STRING
     is the character or the campaign - ?id=, ?campaign_id= - and a meta refresh
     can only carry a URL fixed at write time. replace() rather than assign()
     so Back does not bounce off this page. -->
<script>
  location.replace('/apps/character-sheet/' + location.search + location.hash);
</script>
</head>
<body>
<p>Character Sheet has moved to <a href="/apps/character-sheet/">/apps/character-sheet/</a>.</p>
</body>
</html>
