<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Sheet — Nate's Workshop</title>
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <div>
      <h1 class="logo">Character Sheet</h1>
      <div class="logo-sub">palladium &amp; rifts</div>
    </div>
  </div>
  <div class="header-right">
    <span class="header-group">
      <button class="btn btn-sm" id="play-toggle" onclick="togglePlay()" style="display:none">▶ Play</button>
      <button class="btn btn-sm noprint" id="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
    </span>
    <span class="header-group">
      <a href="codex.html" class="home-link">codex</a>
      <a href="/apps/character-creator/" class="home-link">← character creator</a>
      <a href="/" class="home-link">← workshop</a>
    </span>
  </div>
</header>

<main class="wrap wrap-sheet">
  <div id="app"><p class="muted">Loading sheet…</p></div>
</main>

<script src="/shared/js/ui.js"></script>
<script src="js/play-queue.js"></script>
<script src="js/sticky.js"></script>
<script src="js/sheet-layout.js"></script>
<script src="js/derive.js"></script>
<script src="js/rules.js"></script>
<script src="js/picker.js"></script>
<script src="js/api.js"></script>
<script type="module" src="js/language-skills.js"></script>
<script type="module" src="js/dice.js"></script>
<!-- The banked-picks picker filters the catalog by a grant's categories, and an
     entry may be an OBJECT narrowing what it admits -
     {"name":"Physical","except":["Acrobatics",...]}. A plain `includes` matches
     only the plain-string entries: one live grant carries thirteen categories of
     which TEN are objects, so ten categories would vanish from the picker.
     `categoryAllows` is the matcher the server, the wizard and the validator
     already share - the sheet uses it rather than keeping a fourth copy of the
     rule. UI-AUDIT F30. -->
<script type="module">
  import { categoryAllows, categoryLabel } from './js/parser.js';
  globalThis.skillCats = { categoryAllows, categoryLabel };
</script>
<script src="sheet.js"></script>
</body>
</html>
