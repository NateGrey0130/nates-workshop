<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Dashboard — Nate's Workshop</title>
<!-- Home-screen and tab icon. The art is one square, full-bleed slate, in
     four sizes; /favicon.ico carries 16/32/48 for the tab. iOS reads
     apple-touch-icon for Add to Home Screen and ignores everything else here. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/shared/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0F1412">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/apps/character-creator/styles.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <div>
      <h1 class="logo">Campaign Dashboard</h1>
      <div class="logo-sub">party roster &amp; journal</div>
    </div>
  </div>
  <div class="header-right">
    <div class="appnav" data-appnav data-app="gm"></div>
  </div>
</header>

<main class="wrap wrap-dash">
  <!-- flash() in dashboard.js: a failure in a shared view said here instead of
       an alert box. Outside #app, so a render() cannot wipe it. -->
  <p id="msg" class="small" role="status" aria-live="polite"></p>
  <div id="app"><p class="muted">Loading dashboard…</p></div>
</main>

<script src="/shared/js/client-errors.js"></script>
<script src="/shared/js/ui.js"></script>
<script src="/shared/js/appnav.js"></script>
<script src="/apps/character-creator/js/api.js"></script>
<script src="/apps/character-creator/js/campaign-list.js"></script>
<script src="/apps/character-creator/js/name-panel.js"></script>
<script src="/apps/character-creator/js/npc-sheets.js"></script>
<script src="/apps/character-creator/js/transfer-dialog.js"></script>
<script src="/apps/character-creator/js/derive.js"></script>
<script src="/apps/character-creator/js/undo-toast.js"></script>
<!-- The setting pages and the journal feed, shared with every game's GM page
     (/shared/js/campaign/core.js says what each takes). core.js first;
     downscale.js shrinks a picture before it is uploaded (UI-AUDIT F57), so it
     loads before setting.js, like every other classic script it depends on. -->
<script src="/shared/js/campaign/core.js"></script>
<script src="/shared/js/campaign/downscale.js"></script>
<script src="/shared/js/campaign/notes.js"></script>
<script src="/shared/js/campaign/setting.js"></script>
<script src="/shared/js/campaign/table.js"></script>
<!-- confirmDialog: every question this page and its shared views ask, in a
     <dialog> rather than the browser's confirm box. Before dashboard.js. -->
<script src="/apps/character-creator/js/confirm-dialog.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
