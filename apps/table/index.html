<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Table — Nate's Workshop</title>
<!-- Home-screen and tab icon. The art is one square, full-bleed slate, in
     four sizes; /favicon.ico carries 16/32/48 for the tab. iOS reads
     apple-touch-icon for Add to Home Screen and ignores everything else here.

     apps/pick3cut5 deliberately has NO icon links. Its Access bypass is a list
     of exact paths, all five destination slots are in use, and its smoke test
     derives the list from this very head - a link here would demand a sixth
     slot that does not exist. See apps/pick3cut5/test/smoke.mjs. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/shared/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0F1412">
<!-- Board & Tissue, the RPG suite's system (DESIGN.md): shared first, then the
     character creator's sheet, whose :root wins. table.css adds only what a
     live table needs - the dice box, the feed, and the TV's own dark view. -->
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/apps/character-creator/styles.css">
<link rel="stylesheet" href="table.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <div>
      <h1 class="logo">The Table</h1>
      <div class="logo-sub" id="sub">one live room for the whole game</div>
    </div>
  </div>
  <div class="header-right">
    <a href="/" class="home-link">← workshop</a>
  </div>
</header>

<main class="wrap" id="app">
  <p class="muted">Loading…</p>
</main>

<script src="/shared/js/ui.js"></script>
<script src="table.js"></script>
</body>
</html>
